
name: Pruebas Delphi + Sonar

on:
  push:
    branches:
      - main
      - develop
      - 'staging*'
      - 'hotfix*'
      - 'bug-fix*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:

  # Job 1: Runner propio (necesita Delphi instalado)
  pruebas:
    runs-on: [self-hosted, windows]

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Compilar proyecto
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Embarcadero\Studio\37.0\bin\rsvars.bat"
          msbuild Project2.dproj /t:Build /p:Config=Debug /p:Platform=Win32 "/p:DCC_Define=CI"

      - name: Ejecutar pruebas
        shell: cmd
        run: Win32\Debug\Project2.exe --exitbehavior:Continue --xmlfile:TestResults.xml

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: TestResults.xml
          if-no-files-found: warn

  # Job 2: Runner de GitHub (no necesita Delphi)
  sonar:
    needs: pruebas
    runs-on: windows-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar resultados de pruebas
        uses: actions/download-artifact@v4
        with:
          name: resultados-pruebas
          path: .

      - name: Verificar resultados
        shell: pwsh
        run: |
          if (Test-Path "TestResults.xml") {
            Write-Host "Reporte de pruebas encontrado."
          } else {
            Write-Error "No se encontró TestResults.xml"
            exit 1
          }

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_REGION: us
        with:
          args: >
            -Dsonar.organization=devsecops-axity
            -Dsonar.projectKey=delphi-unittest
            -Dsonar.sources=.
            -Dsonar.sourceEncoding=UTF-8
