name: Pruebas Delphi (DUnitX)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  pruebas:
    # Runner propio con RAD Studio instalado (los de GitHub no traen Delphi)
    runs-on: [self-hosted, windows]

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Compilar proyecto
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Embarcadero\Studio\37.0\bin\rsvars.bat"
          msbuild Project2.dproj /t:Build /p:Config=Debug /p:Platform=Win32 /p:DCC_Define="CI"

      - name: Ejecutar pruebas
        shell: cmd
        run: Win32\Debug\Project2.exe --exitbehavior:Continue --xmlfile:TestResults.xml

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-pruebas
          path: TestResults.xml